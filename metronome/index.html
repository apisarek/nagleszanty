<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e6d7">
  <title>Metronom — NAGLE</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="apple-touch-icon" href="../nagle-apple-touch-icon.png">
  <style>
    @font-face{font-family:Nagle;src:url("../NagleFont.ttf") format("truetype");font-weight:400 900;font-display:swap}
    :root{--paper:#f3e6d7;--ink:#593e28;--faded:#bca994;--cream:#fff9ef;--red:#cb4e38;--green:#52765e}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit;color:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .page{width:min(100%,920px);min-height:100svh;margin:auto;padding:clamp(20px,4vw,48px)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(34px,7vh,72px)}
    .brand{font-family:Nagle,Georgia,serif;font-weight:900;font-size:clamp(28px,5vw,42px);line-height:1;text-decoration:none;color:inherit;letter-spacing:.01em}
    h1{margin:0;font-family:Nagle,Georgia,serif;font-size:clamp(22px,4vw,32px);font-weight:900}
    .metronome{text-align:center}
    .tempo-name{min-height:24px;margin:0 0 8px;color:color-mix(in srgb,var(--ink) 65%,transparent);font-size:14px;letter-spacing:.16em;text-transform:uppercase}
    .tempo-row{display:flex;justify-content:center;align-items:center;gap:clamp(16px,5vw,42px)}
    .round{width:clamp(48px,8vw,62px);aspect-ratio:1;border:2px solid var(--ink);border-radius:50%;background:transparent;font-size:30px;line-height:1;cursor:pointer;transition:.15s}
    .round:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
    .bpm-wrap{display:flex;align-items:baseline;justify-content:center;min-width:180px}
    #bpm{width:3.2ch;padding:0;border:0;background:transparent;text-align:right;font-family:Nagle,Georgia,serif;font-weight:900;font-size:clamp(70px,14vw,126px);line-height:.85;outline:none;-moz-appearance:textfield}
    #bpm::-webkit-inner-spin-button{display:none}
    .unit{margin-left:8px;font-weight:800;font-size:15px;letter-spacing:.08em}
    .slider{width:min(100%,580px);height:34px;margin:28px auto 20px;display:block;accent-color:var(--ink);cursor:pointer}
    .beat-display{height:56px;display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0 26px}
    .beat{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;transition:transform .08s,background .08s,opacity .15s}
    .beat.group-start{width:16px;height:16px}
    .beat.active{background:var(--red);border-color:var(--red);transform:scale(1.65)}
    .beat.muted{opacity:.35}
    .beat.off{opacity:.22;border-style:dashed}
    .beat.off.active{background:transparent;border-color:var(--red);opacity:.55}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .action{min-width:156px;padding:15px 24px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-family:Nagle,Georgia,serif;font-weight:900;font-size:18px;cursor:pointer;transition:.15s}
    .action:hover{transform:translateY(-2px)}
    .action.primary{background:var(--ink);color:var(--paper)}
    .action.primary.playing{background:var(--red);border-color:var(--red)}
    .panel{margin:clamp(40px,7vh,70px) auto 0;padding:clamp(22px,4vw,34px);border:2px solid var(--ink);border-radius:26px;text-align:left}
    .panel-title{margin:0 0 22px;font-family:Nagle,Georgia,serif;font-size:22px;font-weight:900}
    .control-row{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:20px;padding:16px 0;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
    .control-row:first-of-type{border-top:0;padding-top:0}
    .control-row:last-child{padding-bottom:0}
    .label{font-weight:750}
    .segmented{display:flex;flex-wrap:wrap;gap:7px}
    .segment{min-width:39px;height:39px;padding:0 11px;border:1.5px solid var(--ink);border-radius:10px;background:transparent;font-weight:750;cursor:pointer}
    .segment[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
    .practice{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
    .stepper button{width:38px;height:38px;border:0;background:transparent;cursor:pointer;font-size:20px}
    .stepper output{min-width:34px;text-align:center;font-weight:850}
    .status{margin:18px 0 0;text-align:center;font-weight:750;min-height:24px;color:var(--green)}
    .hint{margin:28px 0 0;text-align:center;color:color-mix(in srgb,var(--ink) 58%,transparent);font-size:13px}
    button:focus-visible,input:focus-visible{outline:3px solid #006d77;outline-offset:4px}
    @media(max-width:600px){
      .page{padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
      header{margin-bottom:28px}.brand{font-size:28px}h1{font-size:21px}
      .tempo-name{margin-bottom:4px}.tempo-row{gap:8px}.round{width:46px;font-size:26px}.bpm-wrap{min-width:142px}#bpm{font-size:76px}.unit{margin-left:5px;font-size:12px}
      .slider{height:30px;margin:18px auto 10px}.beat-display{height:42px;margin:2px 0 14px;gap:10px}
      .actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}.action{min-width:0;padding:13px 10px;font-size:15px}.status{margin-top:12px;font-size:14px}
      .panel{margin-top:28px;padding:20px 18px;border-radius:20px}.panel-title{margin-bottom:16px;font-size:20px}.control-row{grid-template-columns:1fr;gap:11px;padding:15px 0}.label{font-size:14px}
      .segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.segment{width:100%;height:44px;font-size:15px}
      .practice{display:flex;align-items:center;gap:8px 10px}.stepper{min-width:116px;justify-content:space-between}.stepper button{width:42px;height:42px}
      .hint{display:none}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <header><a class="brand" href="../" aria-label="NAGLE — strona główna">NAGLE</a><h1>METRONOM</h1></header>
    <section class="metronome" aria-label="Metronom">
      <p class="tempo-name" id="tempoName">Andante</p>
      <div class="tempo-row">
        <button class="round" id="slower" aria-label="Zmniejsz tempo">−</button>
        <div class="bpm-wrap"><input id="bpm" type="number" min="30" max="240" value="100" inputmode="numeric" aria-label="Tempo w uderzeniach na minutę"><span class="unit">BPM</span></div>
        <button class="round" id="faster" aria-label="Zwiększ tempo">+</button>
      </div>
      <input class="slider" id="tempoSlider" type="range" min="30" max="240" value="100" aria-label="Tempo">
      <div class="beat-display" id="beatDisplay" aria-hidden="true"></div>
      <div class="actions">
        <button class="action primary" id="start">START</button>
        <button class="action" id="tap">WYSTUKAJ TEMPO</button>
      </div>
      <p class="status" id="status" aria-live="polite">Gotowy</p>
    </section>

    <section class="panel" aria-labelledby="settingsTitle">
      <h2 class="panel-title" id="settingsTitle">Ustawienia rytmu</h2>
      <div class="control-row">
        <span class="label">Metrum</span>
        <div class="segmented" id="meterControl" aria-label="Wybierz metrum"></div>
      </div>
      <div class="control-row">
        <span class="label">Grane uderzenia</span>
        <div class="segmented" id="beatControl" aria-label="Wybierz grane uderzenia"></div>
      </div>
      <div class="control-row">
        <span class="label">Dźwięk</span>
        <div class="segmented" id="soundControl" aria-label="Wybierz dźwięk metronomu">
          <button class="segment" data-sound="soft" aria-pressed="false">Łagodny</button>
          <button class="segment" data-sound="classic" aria-pressed="true">Klasyczny</button>
          <button class="segment" data-sound="sharp" aria-pressed="false">Ostry</button>
        </div>
      </div>
      <div class="control-row">
        <span class="label">Trening wewnętrznego metronomu</span>
        <div class="practice">
          <span>Graj</span>
          <div class="stepper"><button data-step="play" data-delta="-1" aria-label="Mniej granych taktów">−</button><output id="playBars">1</output><button data-step="play" data-delta="1" aria-label="Więcej granych taktów">+</button></div>
          <span>takty, wycisz</span>
          <div class="stepper"><button data-step="mute" data-delta="-1" aria-label="Mniej wyciszonych taktów">−</button><output id="muteBars">0</output><button data-step="mute" data-delta="1" aria-label="Więcej wyciszonych taktów">+</button></div>
          <span>takty</span>
        </div>
      </div>
    </section>
    <p class="hint">Spacja — start/stop · T — wystukaj tempo · ← → — zmień BPM</p>
  </main>

  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const bpmInput = $('#bpm'), slider = $('#tempoSlider'), beatDisplay = $('#beatDisplay');
      const startButton = $('#start'), status = $('#status');
      const meters = [
        {label:'1/4',beats:1,groups:[1]}, {label:'2/4',beats:2,groups:[2]},
        {label:'3/4',beats:3,groups:[3]}, {label:'4/4',beats:4,groups:[4]},
        {label:'5/4',beats:5,groups:[3,2]}, {label:'6/8',beats:6,groups:[3,3]},
        {label:'7/8',beats:7,groups:[3,2,2]}, {label:'9/8',beats:9,groups:[3,3,3]},
        {label:'12/8',beats:12,groups:[3,3,3,3]}
      ];
      let bpm = 100, meter = meters[3], beats = meter.beats, playBars = 1, muteBars = 0, sound = 'classic';
      let activeBeats = new Set(Array.from({length:beats},(_,i)=>i));
      let audio, timer, silentCarrier, audioUnlocked = false, playing = false, nextNoteTime = 0, beatIndex = 0, barIndex = 0, tapTimes = [];

      const tempoWord = n => n < 45 ? 'Largo' : n < 60 ? 'Lento' : n < 76 ? 'Adagio' : n < 108 ? 'Andante' : n < 120 ? 'Moderato' : n < 156 ? 'Allegro' : n < 200 ? 'Presto' : 'Prestissimo';
      function setBpm(value) {
        bpm = Math.max(30, Math.min(240, Math.round(Number(value) || 100)));
        bpmInput.value = slider.value = bpm;
        $('#tempoName').textContent = tempoWord(bpm);
      }
      function replaceContent(parent, children) {
        while (parent.firstChild) parent.removeChild(parent.firstChild);
        children.forEach(child => parent.appendChild(child));
      }
      function drawBeats() {
        const starts=[]; let sum=0; meter.groups.slice(0,-1).forEach(n=>{sum+=n;starts.push(sum)});
        replaceContent(beatDisplay, Array.from({length:beats},(_,i) => {
          const el=document.createElement('i'); el.className='beat'+(starts.includes(i)?' group-start':'')+(activeBeats.has(i)?'':' off'); el.dataset.beat=i; return el;
        }));
      }
      function drawBeatControl() {
        replaceContent($('#beatControl'), Array.from({length:beats},(_,i)=>{
          const button=document.createElement('button'); button.className='segment'; button.textContent=i+1;
          button.setAttribute('aria-label',`Uderzenie ${i+1}`); button.setAttribute('aria-pressed',activeBeats.has(i));
          button.onclick=()=>{ activeBeats.has(i)?activeBeats.delete(i):activeBeats.add(i); button.setAttribute('aria-pressed',activeBeats.has(i)); drawBeats(); };
          return button;
        }));
      }
      function isMutedBar(bar) { const cycle = playBars + muteBars; return muteBars > 0 && (bar % cycle) >= playBars; }
      function click(time, accent, muted) {
        if (muted) return;
        const osc = audio.createOscillator(), gain = audio.createGain();
        const profiles = {
          soft: {type:'sine', frequencies:[520,650,780], volumes:[.12,.16,.2], duration:.055},
          classic: {type:'sine', frequencies:[820,1000,1250], volumes:[.18,.24,.32], duration:.045},
          sharp: {type:'square', frequencies:[1450,1850,2300], volumes:[.26,.34,.44], duration:.075}
        };
        const profile = profiles[sound], level = Math.max(0,Math.min(2,accent));
        const boostedVolume = Math.min(1.25, profile.volumes[level] * 2.25);
        osc.type = profile.type; osc.frequency.value = profile.frequencies[level];
        gain.gain.setValueAtTime(0.0001,time); gain.gain.exponentialRampToValueAtTime(boostedVolume,time+.002); gain.gain.exponentialRampToValueAtTime(.0001,time+profile.duration);
        osc.connect(gain).connect(audio.destination); osc.start(time); osc.stop(time+profile.duration+.01);
      }
      function schedule(beat, bar, time) {
        const muted = isMutedBar(bar);
        let cursor=0, groupAccent=false; for(const size of meter.groups){ if(beat===cursor){groupAccent=true;break} cursor+=size; }
        click(time, beat === 0 ? 2 : groupAccent ? 1 : 0, muted || !activeBeats.has(beat));
        const delay = Math.max(0,(time-audio.currentTime)*1000);
        setTimeout(() => {
          if (!playing) return;
          beatDisplay.querySelectorAll('.beat').forEach((el,i) => { el.classList.toggle('active',i===beat); el.classList.toggle('muted',muted); });
          const cycleBar = bar % (playBars + muteBars);
          status.textContent = muted ? `Cisza · takt ${cycleBar-playBars+1} z ${muteBars}` : `Graj · takt ${cycleBar+1} z ${playBars}`;
        },delay);
      }
      function scheduler() {
        while (nextNoteTime < audio.currentTime + .1) {
          schedule(beatIndex,barIndex,nextNoteTime);
          nextNoteTime += 60/bpm;
          if (++beatIndex >= beats) { beatIndex=0; barIndex++; }
        }
      }
      function configurePlaybackSession() {
        if (navigator.audioSession) {
          try { navigator.audioSession.type = 'playback'; } catch (error) {}
          return;
        }
        const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!isiOS) return;
        if (!silentCarrier) {
          const sampleRate=8000, samples=2000, buffer=new ArrayBuffer(44+samples*2), view=new DataView(buffer);
          const text=(offset,value)=>{ for(let i=0;i<value.length;i++) view.setUint8(offset+i,value.charCodeAt(i)); };
          text(0,'RIFF'); view.setUint32(4,36+samples*2,true); text(8,'WAVE'); text(12,'fmt '); view.setUint32(16,16,true);
          view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true);
          view.setUint16(32,2,true); view.setUint16(34,16,true); text(36,'data'); view.setUint32(40,samples*2,true);
          silentCarrier=new Audio(URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}))); silentCarrier.loop=true; silentCarrier.setAttribute('playsinline','');
        }
        const play=silentCarrier.play(); if(play && play.catch) play.catch(()=>{});
      }
      function unlockAudio() {
        configurePlaybackSession();
        if (!audio) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error('Web Audio API unavailable');
          audio = new AudioContextClass();
        }
        if (audio.state !== 'running') {
          const resume = audio.resume();
          if (resume && resume.catch) resume.catch(() => {});
        }
        if (!audioUnlocked) {
          const source = audio.createBufferSource();
          source.buffer = audio.createBuffer(1, 1, audio.sampleRate || 44100);
          source.connect(audio.destination); source.start(0);
          audioUnlocked = true;
        }
      }
      function toggle() {
        if (playing) return stop();
        try {
          unlockAudio();
          playing=true; beatIndex=0; barIndex=0; nextNoteTime=audio.currentTime+.06;
          timer=setInterval(scheduler,25); scheduler(); startButton.textContent='STOP'; startButton.classList.add('playing'); status.textContent='Graj';
        } catch (error) {
          playing=false; status.textContent='Nie udało się uruchomić dźwięku';
        }
      }
      function stop() {
        playing=false; clearInterval(timer); startButton.textContent='START'; startButton.classList.remove('playing');
        if (silentCarrier) { silentCarrier.pause(); silentCarrier.currentTime=0; }
        drawBeats(); status.textContent='Gotowy';
      }
      function tap() {
        const now=performance.now(); tapTimes = tapTimes.filter(t=>now-t<2500); tapTimes.push(now);
        if(tapTimes.length>1){ const gaps=tapTimes.slice(1).map((t,i)=>t-tapTimes[i]); setBpm(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length)); }
        $('#tap').textContent = tapTimes.length < 2 ? 'JESZCZE RAZ' : `${bpm} BPM`;
        clearTimeout(tap.reset); tap.reset=setTimeout(()=>{$('#tap').textContent='WYSTUKAJ TEMPO';tapTimes=[]},1800);
      }

      meters.forEach((choice,index)=>{ const b=document.createElement('button'); b.className='segment'; b.textContent=choice.label; b.setAttribute('aria-pressed',index===3); b.onclick=()=>{meter=choice;beats=meter.beats;activeBeats=new Set(Array.from({length:beats},(_,i)=>i));$('#meterControl').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));beatIndex=0;barIndex=0;drawBeats();drawBeatControl()};$('#meterControl').append(b); });
      $('#soundControl').querySelectorAll('button').forEach(button=>button.onclick=()=>{ sound=button.dataset.sound; $('#soundControl').querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',item===button)); });
      document.querySelectorAll('[data-step]').forEach(btn=>btn.onclick=()=>{ const key=btn.dataset.step, delta=Number(btn.dataset.delta); if(key==='play'){playBars=Math.max(1,Math.min(16,playBars+delta));$('#playBars').value=playBars}else{muteBars=Math.max(0,Math.min(16,muteBars+delta));$('#muteBars').value=muteBars} barIndex=0; });
      bpmInput.onchange=e=>setBpm(e.target.value); slider.oninput=e=>setBpm(e.target.value);
      $('#slower').onclick=()=>setBpm(bpm-1); $('#faster').onclick=()=>setBpm(bpm+1); startButton.onclick=toggle; $('#tap').onclick=tap;
      startButton.addEventListener('touchstart',()=>{ try { unlockAudio(); } catch (error) {} },{passive:true});
      document.addEventListener('visibilitychange',()=>{
        if (!document.hidden && playing && audio && audio.state !== 'running') {
          configurePlaybackSession();
          const resume=audio.resume(); if(resume && resume.catch) resume.catch(()=>stop());
        }
      });
      document.addEventListener('keydown',e=>{ if(e.target===bpmInput) return; if(e.code==='Space'){e.preventDefault();toggle()} else if(e.key.toLowerCase()==='t')tap(); else if(e.key==='ArrowLeft')setBpm(bpm-1); else if(e.key==='ArrowRight')setBpm(bpm+1); });
      configurePlaybackSession(); drawBeats(); drawBeatControl(); setBpm(100);
    })();
  </script>
</body>
</html>
