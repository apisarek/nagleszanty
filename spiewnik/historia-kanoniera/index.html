<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e6d7">
  <title>Historia kanoniera — Śpiewnik NAGLE</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg?v=2">
  <link rel="apple-touch-icon" href="../../nagle-apple-touch-icon.png">
  <style>
    @font-face{font-family:Nagle;src:url("../../NagleFont.ttf") format("truetype");font-weight:400 900;font-display:swap}
    :root{--paper:#f3e6d7;--ink:#593e28;--muted:rgba(89,62,40,.65);--line:rgba(89,62,40,.18);--chip:rgba(255,255,255,.3);--focus:#006d77}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit;color:inherit}
    .page{width:min(100%,1040px);margin:auto;padding:clamp(18px,4vw,52px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
    .brand,.back{color:inherit;text-decoration:none}
    .brand{font-family:Nagle,Georgia,serif;font-size:clamp(28px,5vw,42px);font-weight:900}
    .back{color:var(--muted);font-size:14px}
    .hero{display:grid;gap:14px;margin-bottom:24px}
    h1{margin:0;font-family:Nagle,Georgia,serif;font-size:clamp(42px,8vw,82px);line-height:.9}
    .authors{display:flex;gap:10px 18px;flex-wrap:wrap;margin:0;color:var(--muted);font-size:15px}
    .tools{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 34px;padding:12px 0;background:color-mix(in srgb,var(--paper) 94%,transparent)}
    .control{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .control-label{font-weight:800;color:var(--muted)}
    .control button,.reset{min-width:42px;height:42px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:900;cursor:pointer}
    .control button:hover,.reset:hover,.control button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
    .shift{min-width:82px;text-align:center;font-weight:850}
    .song{display:grid;gap:26px}
    .section{padding-top:24px;border-top:1px solid var(--line)}
    .section:first-child{border-top:0;padding-top:0}
    .section-label{display:inline-block;min-width:2.45em;padding-right:.55em;font-family:Nagle,Georgia,serif;font-weight:900;text-align:right}
    .section-label.empty{visibility:hidden}
    .lines{display:grid;gap:16px;min-width:0}
    .line{display:grid;gap:2px;min-width:0}
    .chords{display:flex;gap:clamp(16px,4vw,30px);min-height:18px;padding-left:2.45em;align-items:end;justify-content:flex-start;flex-wrap:wrap}
    .chord{display:inline-block;min-width:1.6em;color:#8d3b2c;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:clamp(13px,1.75vw,16px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
    .chord sup{position:relative;top:-.12em;font-size:.94em;line-height:0;margin-left:.02em;margin-right:.03em}
    .lyric{font-family:Nagle,Georgia,serif;font-size:clamp(17px,2.25vw,21px);line-height:1.26}
    .song.hide-chords .line{gap:0}
    .song.hide-chords .chords{display:none}
    .line.no-chords{gap:0}
    .line.no-chords .chords{display:none}
    .line.repeat .lyric{color:var(--muted);font-style:italic}
    .loading,.error{color:var(--muted);font-size:18px}
    a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    @media(max-width:700px){
      .page{padding:18px 14px 34px}
      header{align-items:flex-start}.tools{position:static;align-items:flex-start}
      .lines{gap:15px}.chords{gap:20px}.chord{font-size:14px}.authors{display:grid}
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <a class="brand" href="../../" aria-label="NAGLE — strona główna">NAGLE</a>
      <a class="back" href="../">← Śpiewnik</a>
    </header>

    <section class="hero">
      <h1 id="title">Historia kanoniera</h1>
      <p class="authors" id="authors"></p>
    </section>

    <section class="tools" aria-label="Narzędzia śpiewnika">
      <div class="control">
        <span class="control-label">Transpozycja</span>
        <button type="button" id="transposeDown" aria-label="Transponuj pół tonu w dół">−</button>
        <span class="shift" id="shiftLabel">0</span>
        <button type="button" id="transposeUp" aria-label="Transponuj pół tonu w górę">+</button>
        <button type="button" class="reset" id="resetTranspose">Reset</button>
      </div>
      <div class="control" aria-label="Notacja akordów">
        <span class="control-label">Notacja</span>
        <button type="button" id="notationPolish" aria-pressed="true">PL</button>
        <button type="button" id="notationEnglish" aria-pressed="false">EN</button>
      </div>
      <div class="control" aria-label="Widoczność akordów">
        <span class="control-label">Akordy</span>
        <button type="button" id="toggleChords" aria-pressed="true">Ukryj</button>
      </div>
    </section>

    <article class="song" id="song" aria-live="polite">
      <p class="loading">Ładowanie piosenki…</p>
    </article>
  </main>

  <script src="../data/songs.js"></script>
  <script>
    const songEl = document.querySelector("#song");
    const titleEl = document.querySelector("#title");
    const authorsEl = document.querySelector("#authors");
    const shiftLabel = document.querySelector("#shiftLabel");
    const sharpNotes = ["C", "Cis", "D", "Dis", "E", "F", "Fis", "G", "Gis", "A", "B", "H"];
    const flatNotes = ["C", "Des", "D", "Es", "E", "F", "Ges", "G", "As", "A", "B", "H"];
    const englishSharpNotes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
    const englishFlatNotes = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    const flatMinorKeys = new Set([0, 3, 5, 7, 10]);
    const aliases = new Map([
      ["C",0],["Cis",1],["D",2],["Dis",3],["E",4],["F",5],["Fis",6],["G",7],["Gis",8],["A",9],["B",10],["H",11],
      ["Des",1],["Es",3],["Ges",6],["As",8],
      ["c",0],["cis",1],["d",2],["dis",3],["e",4],["f",5],["fis",6],["g",7],["gis",8],["a",9],["b",10],["h",11],
      ["des",1],["es",3],["ges",6],["as",8]
    ]);
    let song;
    let shift = 0;
    let notation = "polish";
    let chordsVisible = true;

    const normalizeShift = (value) => ((value % 12) + 12) % 12;

    const noteNamesForCurrentKey = () => {
      const baseKey = aliases.get(song?.key || "e") ?? 4;
      const targetKey = normalizeShift(baseKey + shift);
      const useFlats = flatMinorKeys.has(targetKey);
      if (notation === "english") return useFlats ? englishFlatNotes : englishSharpNotes;
      return useFlats ? flatNotes : sharpNotes;
    };

    const formatChord = (note, minor, suffix) => {
      if (notation === "english") return `${note}${minor ? "m" : ""}${suffix}`;
      return (minor ? note.toLowerCase() : note) + suffix;
    };

    const chordMarkup = (chord) => {
      const polishMatch = chord.match(/^([A-Ha-h])((?:is|es|s)?)(.*)$/);
      if (notation === "polish" && polishMatch) {
        const [, root, accidental, suffix] = polishMatch;
        return `${root}${accidental}${suffix}`;
      }

      const englishMatch = chord.match(/^([A-G])([#b]?)(.*)$/);
      if (englishMatch) {
        const [, root, accidental, suffix] = englishMatch;
        const symbol = accidental === "#" ? "♯" : accidental === "b" ? "♭" : "";
        return `${root}${symbol ? `<sup>${symbol}</sup>` : ""}${suffix}`;
      }

      return chord;
    };

    const transposeChord = (chord) => {
      const match = chord.match(/^([A-H](?:is|es)?|[a-h](?:is|es)?)(.*)$/);
      if (!match) return chord;

      const [, root, suffix] = match;
      const pitch = aliases.get(root);
      if (pitch === undefined) return chord;

      const minor = root === root.toLowerCase();
      const targetPitch = normalizeShift(pitch + shift);
      const next = noteNamesForCurrentKey()[targetPitch];
      return formatChord(next, minor, suffix);
    };

    const makeLine = (line, labelText = "") => {
      const row = document.createElement("div");
      row.className = `line${line.chords.length ? "" : " no-chords"}${line.text.includes("…") ? " repeat" : ""}`;

      const chords = document.createElement("div");
      chords.className = "chords";
      line.chords.forEach((chord) => {
        const span = document.createElement("span");
        span.className = "chord";
        span.innerHTML = chordMarkup(transposeChord(chord));
        chords.append(span);
      });

      const lyric = document.createElement("div");
      lyric.className = "lyric";
      const label = document.createElement("span");
      label.className = `section-label${labelText ? "" : " empty"}`;
      label.textContent = labelText || "\u00a0";
      const text = document.createElement("span");
      text.textContent = line.text || "\u00a0";
      lyric.append(label, text);

      row.append(chords, lyric);
      return row;
    };

    const render = () => {
      if (!song) return;

      titleEl.textContent = song.title;
      authorsEl.innerHTML = `<span>słowa: ${song.lyricsAuthor}</span><span>muzyka: ${song.musicAuthor}</span>`;
      shiftLabel.textContent = shift === 0 ? "0" : `${shift > 0 ? "+" : ""}${shift}`;
      document.querySelector("#notationPolish").setAttribute("aria-pressed", notation === "polish");
      document.querySelector("#notationEnglish").setAttribute("aria-pressed", notation === "english");
      document.querySelector("#toggleChords").setAttribute("aria-pressed", chordsVisible);
      document.querySelector("#toggleChords").textContent = chordsVisible ? "Ukryj" : "Pokaż";
      songEl.innerHTML = "";
      songEl.classList.toggle("hide-chords", !chordsVisible);

      song.sections.forEach((section) => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "section";

        const lines = document.createElement("div");
        lines.className = "lines";
        section.lines.forEach((line, index) => lines.append(makeLine(line, index === 0 ? section.label : "")));

        sectionEl.append(lines);
        songEl.append(sectionEl);
      });
    };

    const changeShift = (delta) => {
      shift += delta;
      if (shift > 11) shift -= 12;
      if (shift < -11) shift += 12;
      render();
    };

    document.querySelector("#transposeDown").addEventListener("click", () => changeShift(-1));
    document.querySelector("#transposeUp").addEventListener("click", () => changeShift(1));
    document.querySelector("#resetTranspose").addEventListener("click", () => { shift = 0; render(); });
    document.querySelector("#notationPolish").addEventListener("click", () => { notation = "polish"; render(); });
    document.querySelector("#notationEnglish").addEventListener("click", () => { notation = "english"; render(); });
    document.querySelector("#toggleChords").addEventListener("click", () => { chordsVisible = !chordsVisible; render(); });

    const loadSong = (data) => {
      song = data.songs.find((item) => item.slug === "historia-kanoniera");
      if (!song) throw new Error("Brak piosenki w danych");
      render();
    };

    if (window.NAGLE_SONGBOOK) {
      loadSong(window.NAGLE_SONGBOOK);
    } else {
      fetch("../data/songs.json")
      .then((response) => {
        if (!response.ok) throw new Error("Nie udało się pobrać piosenki");
        return response.json();
      })
      .then(loadSong)
      .catch(() => {
        songEl.innerHTML = '<p class="error">Nie udało się załadować piosenki.</p>';
      });
    }
  </script>
</body>
</html>
