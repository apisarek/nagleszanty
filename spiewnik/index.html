<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e6d7">
  <title>Śpiewnik — NAGLE</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="apple-touch-icon" href="../nagle-apple-touch-icon.png">
  <style>
    @font-face{font-family:Nagle;src:url("../NagleFont.ttf") format("truetype");font-weight:400 900;font-display:swap}
    :root{--paper:#f3e6d7;--ink:#593e28;--muted:rgba(89,62,40,.66);--line:rgba(89,62,40,.2);--focus:#006d77}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .page{width:min(100%,900px);margin:auto;padding:clamp(22px,5vw,58px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:clamp(42px,9vw,88px)}
    .brand{font-family:Nagle,Georgia,serif;font-size:clamp(30px,6vw,46px);font-weight:900;color:inherit;text-decoration:none}
    h1{margin:0;font-family:Nagle,Georgia,serif;font-size:clamp(34px,8vw,72px);line-height:.95}
    .song-list{display:grid;gap:14px;margin:0;padding:0;list-style:none}
    .song-link{display:flex;justify-content:space-between;gap:18px;padding:18px 20px;border:2px solid var(--ink);border-radius:20px;color:inherit;text-decoration:none;transition:transform .16s,background .16s}
    .song-link:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
    .song-title{font-family:Nagle,Georgia,serif;font-weight:900;font-size:24px}
    .song-meta{align-self:center;color:var(--muted);font-size:14px;white-space:nowrap}
    .empty{color:var(--muted)}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    @media(max-width:560px){header{align-items:flex-start;flex-direction:column;margin-bottom:34px}.song-link{display:grid}.song-meta{white-space:normal}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <a class="brand" href="../" aria-label="NAGLE — strona główna">NAGLE</a>
      <h1>Śpiewnik</h1>
    </header>

    <ul class="song-list" id="songList" aria-label="Lista piosenek">
      <li class="empty">Ładowanie śpiewnika…</li>
    </ul>
  </main>

  <script src="data/songs.js"></script>
  <script>
    const list = document.querySelector("#songList");

    const renderSongs = ({ songs }) => {
      list.innerHTML = "";

      songs.forEach((song) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.className = "song-link";
        link.href = `${song.slug}/`;
        link.innerHTML = `<span class="song-title">${song.title}</span><span class="song-meta">sł. ${song.lyricsAuthor} · muz. ${song.musicAuthor}</span>`;
        item.append(link);
        list.append(item);
      });
    };

    const loadSongs = () => {
      if (window.NAGLE_SONGBOOK) {
        renderSongs(window.NAGLE_SONGBOOK);
        return;
      }

      fetch("data/songs.json")
      .then((response) => {
        if (!response.ok) throw new Error("Nie udało się pobrać listy piosenek");
        return response.json();
      })
      .then(renderSongs)
      .catch(() => {
        list.innerHTML = '<li class="empty">Nie udało się załadować śpiewnika.</li>';
      });
    };

    loadSongs();
  </script>
</body>
</html>
