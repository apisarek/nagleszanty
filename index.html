<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAGLE</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="mask-icon" href="favicon.svg?v=2" color="#000000">
    <link rel="apple-touch-icon" sizes="180x180" href="/nagle-apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pochaevsk&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3e6d7;
            --ink: #161310;
            --ink-soft: rgba(22, 19, 16, 0.64);
            --icon-filter: brightness(0) saturate(100%) invert(7%) sepia(14%) saturate(807%) hue-rotate(343deg) brightness(91%) contrast(94%);
            --focus: #006d77;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg-color);
        }

        body {
            height: 100vh;
            height: 100svh;
            margin: 0;
            background: var(--bg-color);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .page {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            display: grid;
            place-items: center;
            padding: clamp(20px, 4vw, 56px);
            overflow: hidden;
        }

        .content {
            width: min(100%, 920px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 4vw, 52px);
        }

        .logo {
            display: block;
            width: min(54vw, 50svh, 500px);
            max-width: calc(100vw - 280px);
            height: auto;
            flex: 0 1 500px;
            object-fit: contain;
            user-select: none;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(10px, 1.7dvh, 18px);
            flex: 0 0 auto;
        }

        .social-link {
            width: max-content;
            min-width: 194px;
            min-height: 46px;
            display: grid;
            grid-template-columns: 60px max-content;
            align-items: center;
            column-gap: 14px;
            color: var(--ink);
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 8px 14px;
            text-decoration: none;
            font-family: "Pochaevsk", Georgia, "Times New Roman", Times, serif;
            font-size: clamp(18px, 1.5vw, 22px);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0.25px 0 currentColor, -0.25px 0 currentColor;
            transition: color 160ms ease, border-color 160ms ease, transform 160ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .social-link:hover {
            color: var(--ink-soft);
            transform: translateY(-2px);
        }

        .social-link:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 4px;
            border-color: currentColor;
        }

        .social-link img,
        .social-link svg {
            width: clamp(28px, 2.6vw, 36px);
            height: clamp(28px, 2.6vw, 36px);
            justify-self: center;
            flex: 0 0 auto;
            display: block;
            transition: opacity 160ms ease;
        }

        .social-link span {
            justify-self: start;
            white-space: nowrap;
        }

        .social-link img {
            object-fit: contain;
            filter: var(--icon-filter);
        }

        .social-link:hover img,
        .social-link:hover svg {
            opacity: 0.64;
        }

        .social-link .brand-icon--youtube {
            width: clamp(54px, 4.4vw, 64px);
            height: clamp(38px, 3vw, 46px);
        }

        .social-link svg {
            fill: currentColor;
        }

        .social-link--stroke svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 720px) {
            .page {
                padding: 32px 22px calc(88px + env(safe-area-inset-bottom));
            }

            .content {
                width: 100%;
            }

            .logo {
                width: min(86vw, 58dvh, 460px);
                max-width: 100%;
                margin-left: 0;
            }

            .social-links {
                position: fixed;
                right: 0;
                bottom: 0;
                left: 0;
                flex-direction: row;
                justify-content: center;
                gap: clamp(6px, 2.5vw, 14px);
                padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
                background: color-mix(in srgb, var(--bg-color) 92%, white);
                border-top: 1px solid rgba(22, 19, 16, 0.12);
            }

            .social-link {
                min-width: 0;
                min-height: 0;
                width: clamp(42px, 13vw, 54px);
                aspect-ratio: 1;
                display: grid;
                place-items: center;
                gap: 0;
                border-radius: 50%;
                padding: 0;
            }

            .social-link span {
                display: none;
            }

            .social-link img,
            .social-link svg {
                width: 58%;
                height: 58%;
            }

            .social-link .brand-icon--youtube {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page" aria-label="NAGLE links">
        <div class="content">
            <img src="nagle.svg" class="logo" alt="NAGLE">

            <nav class="social-links" aria-label="Social links">
                <a class="social-link" href="https://www.youtube.com/@nagleszanty" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
                    <img src="assets/icons/youtube.png" class="brand-icon--youtube" alt="" aria-hidden="true">
                    <span>YouTube</span>
                </a>

                <a class="social-link" href="https://www.facebook.com/nagleszanty" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
                    <img src="assets/icons/facebook-secondary.png" class="brand-icon--facebook" alt="" aria-hidden="true">
                    <span>Facebook</span>
                </a>

                <a class="social-link" href="https://www.instagram.com/nagleszanty/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
                    <img src="assets/icons/instagram.svg" alt="" aria-hidden="true">
                    <span>Instagram</span>
                </a>

                <a class="social-link" href="https://open.spotify.com/artist/1HgdSk9AL2DK9HWOYctNJ3" target="_blank" rel="noopener noreferrer" aria-label="Spotify" title="Spotify">
                    <img src="assets/icons/spotify.svg" alt="" aria-hidden="true">
                    <span>Spotify</span>
                </a>

                <a class="social-link social-link--stroke" href="mailto:nagleszanty@gmail.com" aria-label="Email nagleszanty@gmail.com" title="nagleszanty@gmail.com">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m4 7 8 6 8-6"/>
                    </svg>
                    <span>nagleszanty@gmail.com</span>
                </a>

                <a class="social-link social-link--stroke" href="tel:+48788227537" aria-label="Phone +48 788227537" title="+48 788227537">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6.3 6.3l1.3-1.3a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2Z"/>
                    </svg>
                    <span>+48 788227537</span>
                </a>
            </nav>
        </div>
    </main>
</body>
</html>
